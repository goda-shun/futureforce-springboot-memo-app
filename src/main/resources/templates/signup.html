<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ユーザー登録</title>
</head>
<body>
	<form th:action="@{/admin/signup}" th:object="${admin}" method="post">
	  <input type="text" th:field="*{last_name}" name="last_name" placeholder="姓">
	  <input type="text" th:field="*{first_name}" name="first_name" placeholder="名">	  
	  <input type="email" th:field="*{email}" name="email" placeholder="メール">
	  <input type="password" th:field="*{password}" name="password" placeholder="パスワード">
	  <button type="submit">登録</button>
	</form>

</body>
</html>
