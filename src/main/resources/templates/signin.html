<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ログイン画面</title>
</head>
<body>
	<form th:action="@{/login}" th:object="${admin}" method="post">
	  <input type="email" name="email" placeholder="メール">
	  <input type="password" name="password" placeholder="パスワード">
	  <button type="submit">ログイン</button>
	</form>
	<div th:if="${param.error}">
	  ログイン失敗
	</div>
	
	<hr>

	<a href="/admin/signup">
	  新規登録はこちら
	</a>

</body>
</html>
